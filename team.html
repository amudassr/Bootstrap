<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Section Cards</title>
    <!-- CSS link bootstrap  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Team Section Cards -->

    <div class="container mt-5">
        <h1 class="text-center">Meet Our Team</h1>
        <div class="row mt-4 text-center justify-content-evenly">
            <div class="col-lg-4 col-md-6 mb-3">
                <div class="card">
                    <img src="/Bootstrap/images/men-1.jpeg" alt="men">
                    <div class="card-body">

                        <h5 class="card-title">Ahmed Khan</h5>
                        <p>Frontend Developer</p>

                        <button class="btn btn-primary btn-sm">LinkedIn</button>
                        <button class="btn btn-dark btn-sm">Github</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 mb-3">
                <div class="card">
                    <img src="/Bootstrap/images/men-2.jpeg" alt="men">
                    <div class="card-body">

                        <h5 class="card-title">Ali Raza</h5>
                        <p>Backend Developer</p>

                        <button class="btn btn-primary btn-sm">LinkedIn</button>
                        <button class="btn btn-dark btn-sm">Github</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 mb-3">
                <div class="card">
                    <img src="/Bootstrap//images/men-3.jpeg" alt="men">
                    <div class="card-body">

                        <h5 class="card-title">Usman Ahmed</h5>
                        <p>UI/UX Designer</p>

                        <button class="btn btn-primary btn-sm">LinkedIn</button>
                        <button class="btn btn-dark btn-sm">Github</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
