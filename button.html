<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Group in Bootstrap</title>
    <link rel="stylesheet" href="button.css">
    <!-- Bootstrap CSS link  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Bootstrap Js link  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Button Group Component  -->

    <div class="container">
        <h2>Button Group</h2>
        <div class="btn-group">
            <button class="btn btn-primary">Left</button>
            <button class="btn btn-primary">Middle</button>
            <button class="btn btn-primary">Right</button>
        </div>
        <button class="btn btn-success">one</button>
        <button class="btn btn-success">two</button>
        <button class="btn btn-success">three</button>

        <br><br>

        <!-- Active Button -->

        <h2>Active Button</h2>
        <div class="btn-group">
            <a href="#" class="btn btn-secondary active">Active link</a>
            <a href="#" class="btn btn-secondary">Link</a>
            <a href="#" class="btn btn-secondary">Link</a>
        </div>


        <br><br>

        <!-- Mixed Styles -->

        <h2>Mixed Styles</h2>
        <div class="btn-group">
            <a href="#" class="btn btn-danger">Left</a>
            <a href="#" class="btn btn-warning">Middle</a>
            <a href="#" class="btn btn-success">Right</a>
        </div>

        <br><br>

        <!-- Outlined styles  -->

        <h2>Outlined styles </h2>
        <div class="btn-group">
            <a href="#" class="btn btn-outline-primary">Left</a>
            <a href="#" class="btn btn-outline-primary">Middle</a>
            <a href="#" class="btn btn-outline-primary">Right</a>
        </div>

        <br><br>

        <!-- Checkbox button groups -->

        <h2>Checkbox button groups</h2>
        <div class="btn-group">
            <input type="checkbox" id="btncheck1" class="btn-check">
            <label for="btncheck1" class="btn btn-outline-primary">Checkbox 1</label>

            
            <input type="checkbox" id="btncheck2" class="btn-check">
            <label for="btncheck2" class="btn btn-outline-primary">Checkbox 2</label>

            
            <input type="checkbox" id="btncheck3" class="btn-check">
            <label for="btncheck3" class="btn btn-outline-primary">Checkbox 3</label>
        </div>
        

        <br><br>

        <!-- Radio button groups -->

        <h2>Radio button groups</h2>
        <div class="btn-group">
            <input type="radio" class="btn-check" name="btnradio" id="btnradio1">
            <label for="btnradio1" class="btn btn-outline-primary">Radio 1</label>

            
            <input type="radio" class="btn-check" name="btnradio" id="btnradio2">
            <label for="btnradio2" class="btn btn-outline-primary">Radio 2</label>

            
            <input type="radio" class="btn-check" name="btnradio" id="btnradio3">
            <label for="btnradio3" class="btn btn-outline-primary">Radio 3</label>
        </div>

        <br><br>


        <!-- Button toolbar  -->


        <h2>Button toolbar</h2>

        <!-- first btn group  -->
        <div class="btn-group">
            <button type="button" class="btn btn-primary">1</button>
            <button type="button" class="btn btn-primary">2</button>
            <button type="button" class="btn btn-primary">3</button>
            <button type="button" class="btn btn-primary">4</button>
        </div>

        <!-- second btn group -->
        <div class="btn-group">
            <button type="button" class="btn btn-secondary">5</button>
            <button type="button" class="btn btn-secondary">6</button>
            <button type="button" class="btn btn-secondary">7</button>
        </div>

        <!-- third btn group -->
        <div class="btn-group">
            <button type="button" class="btn btn-info">8</button>
        </div>
    </div>



</body>

</html>
