<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards | Assignment</title>
    <!-- CSS link bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Product Cards Assignment  -->

    <div class="container mt-5">
        <h1 class="text-center">Our Products</h1>

        <div class="row">

            <div class="col-lg-4 col-md-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <img src="/Bootstrap/images/laptop.jpeg" alt="laptop-image" class="w-100">
                        <h5 class="card-title">Laptop</h5>
                        <div class="card-text">Powerful Laptop for Developers</div>
                        <h4>Rs 120,000</h4>
                        <button class="btn btn-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>


            <div class="col-lg-4 col-md-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <img src="/Bootstrap/images/mobile.jpeg" alt="mobile-image" class="w-100">
                        <h5 class="card-title">Mobile</h5>
                        <div class="card-text">Latest Smartphone</div>
                        <h4>Rs 80,000</h4>
                        <button class="btn btn-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>


            <div class="col-lg-4 col-md-6 mb-3">
                <div class="card">
                    <div class="card-body">
                        <img src="/Bootstrap/images/headphone.jpeg" alt="headphone-image" class="w-100">
                        <h5 class="card-title">Headphones</h5>
                        <div class="card-text">Noise Cancelling Headphones</div>
                        <h4>Rs 15,000</h4>
                        <button class="btn btn-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>


        </div>
    </div>

    <!-- JavaScript link bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</body>

</html>
