<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in bootstrap</title>
    <!-- CSS link bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Forms in bootstrap  -->

    <div class="container">
        <h2>Registration form</h2>
        <form>
            <!-- Form Controls  -->
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label for="email" class="form-label"> Email</label>
                    <input type="email" placeholder="Enter your email" class="form-control" id="email">
                </div>

                <div class="mb-3 col-md-6">

                    <label for="password" class="form-label"> Password</label>
                    <input type="password" placeholder="Enter your password" class="form-control" id="password">
                </div>
            </div>


            <!-- Select in Form  -->
            <div class="mb-3">
                <select class="form-select">
                    <option selected>select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="others">Others</option>
                </select>
            </div>


            <!-- Checkbox & Radio in Form -->
            <div class="mb-3 form-check">
                <label for="agree" class="form-check-label">Agree</label>
                <input type="checkbox" id="agree" class="form-check-input">
            </div>

            <div class="mb-3 form-check">
                <label for="yes" class="form-check-label">Yes</label>
                <input type="radio" id="yes" class="form-check-input">
            </div>

            <div class="mb-3 form-check" <label for="no" class="form-check-label">No</label>
                <input type="radio" id="no" class="form-check-input">
            </div>


            <!-- Form Switch  -->
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
