<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards Assignment</title>
    <!-- CSS link bootstrap  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>

        .card:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
        .recommended {
            border: 2px solid blue;
        }
    </style>
</head>

<body>

    <!-- Pricing Cards Assignment  -->

    <div class="container-fluid">
        <h1 class="text-center mt-5">Pricing Plans</h1>
        <p class="text-center">Choose your best plan</p>

        <div class="row text-center justify-content-evenly mt-4">
            <div class="col-lg-3 col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header">
                        <h4>Basic</h4>
                    </div>
                    <div class="card-body">
                        <h1>$0</h1>
                        <ul class="list-unstyled">
                            <li>5 Users</li>
                            <li>1GB Storage</li>
                            <li>Email Support</li>
                        </ul>
                        <button class="btn btn-outline-primary w-100">Sign up</button>
                    </div>
                </div>
            </div>



            <div class="col-lg-3 col-md-6 mb-3">
                <div class="card h-100 recommended">
                    <div class="card-header bg-primary text-white">
                        <h4>Standard ⭐</h4>
                    </div>
                    <div class="card-body">
                        <h1>$9</h1>
                        <ul class="list-unstyled">
                            <li>10 Users</li>
                            <li>5GB Storage</li>
                            <li>Priority Support</li>
                        </ul>
                        <button class="btn btn-primary w-100">Get Started</button>
                    </div>
                </div>
            </div>



            <div class="col-lg-3 col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header">
                        <h4>Premium</h4>
                    </div>
                    <div class="card-body">
                        <h1>$19</h1>
                        <ul class="list-unstyled">
                            <li>20 Users</li>
                            <li>10GB Storage</li>
                            <li>Phone Support</li>
                        </ul>
                        <button class="btn btn-outline-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>


            <div class="col-lg-3 col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header">
                        <h4>Enterprise</h4>
                    </div>
                    <div class="card-body">
                        <h1>$49</h1>
                        <ul class="list-unstyled">
                            <li>Unlimited Users</li>
                            <li>50GB Storage</li>
                            <li>24/7 Support</li>
                        </ul>
                        <button class="btn btn-outline-primary w-100">Contact</button>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <!-- JavaScript link bootstrap  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">


</body>

</html>
