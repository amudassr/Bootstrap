<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards in bootstrap</title>
    <!-- CSS link bootstrap  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- Js link bootstrap  -->
    <source src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" type="">

    <!-- Cards Component  -->

    <div class="container">
        <h2>Cards Component</h2>

        <!-- Jerry Card -->
        <div class="card" style="width: 18rem;">
            <img src="/CSS/css-part-5/image/dog.jpg" class="card-img-top" alt="">
            <div class="card-body">
                <h5 class="card-title">Meet Jerry</h5>
                <p class="card-text">Jerry is a charming and friendly dog with a heart of gold, and he is looking for a
                    loving home to call his own.</p>
                <a href="#" class="btn btn-secondary">Know More</a>
            </div>
        </div>

        <br><br>

        <!-- Tom Card  -->

        <div class="card" style="width: 18rem;">
            <img src="/CSS/css-part-5/image/cat.jpg" class="card-img-top" alt="">
            <div class="card-body">
                <h5 class="card-title">Meet Tom</h5>
                <p class="card-text">Tom is a charming and friendly dog with a heart of gold, and he is looking for a
                    loving home to call his own.</p>
                <a href="#" class="btn btn-secondary">Know More</a>
            </div>
        </div>
    </div>
</body>

</html>
